<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Temporary Laptop Modes</title>
  <desc id="desc">Power settings for this moment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a3a"/><stop offset="1" stop-color="#251741"/></linearGradient>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientTransform="translate(105 70) rotate(35) scale(640 480)"><stop stop-color="#5f8fff" stop-opacity=".55"/><stop offset="1" stop-color="#5f8fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9fc4ff"/><stop offset="1" stop-color="#c9a8ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#050914" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#blue)"/>
  <circle cx="1080" cy="85" r="300" fill="#a777ff" opacity=".12"/>
  <g transform="translate(850 185)" filter="url(#shadow)">
