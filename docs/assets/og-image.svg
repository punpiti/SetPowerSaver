  <text x="92" y="147" fill="#99baff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">WINDOWS SYSTEM-TRAY UTILITY</text>
  <text x="84" y="276" fill="#f0f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Temporary Laptop Modes</text>
