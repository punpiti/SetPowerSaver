    <rect x="57" y="72" width="146" height="98" rx="12" fill="#18234b"/>
    <rect x="67" y="82" width="126" height="70" rx="6" fill="#8eb8ff" opacity=".9"/>
    <path d="M35 181h190l20 35H15z" fill="#18234b"/>
    <circle cx="178" cy="153" r="43" fill="#f4f7ff"/>
    <path d="M178 127v28l19 12" fill="none" stroke="#455386" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
